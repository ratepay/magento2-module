<div class="vendor-payment-info" data-bind="if: isVisible()">
    <div class="panel rp-ccd2-panel" id="rp-ccd2-container-v1">
        <div class="panel-body">
            <h4 class="rp-ccd2-heading">
                <span class="rp-icon rp-ccd2-info-icon" aria-hidden="true">
                    <svg viewBox="0 0 16 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.3">
                        <circle cx="8" cy="8" r="7"/>
                        <line x1="8" y1="7.2" x2="8" y2="11.5"/>
                        <circle cx="8" cy="4.6" r="0.9" fill="currentColor" stroke="none"/>
                    </svg>
                </span>
                <!-- ko i18n: 'Standard EU Consumer Credit Information'--><!-- /ko -->
            </h4>

            <p id="rp-ccd2-text" data-bind="text: secciSendText()"></p>

            <p class="rp-ccd2-more">
                <a href="#" id="rp-ccd2-learn-more" data-bind="click: toggleDetails">
                    <!-- ko i18n: 'Learn more'--><!-- /ko -->
                </a>
            </p>

            <div id="rp-ccd2-more-info" data-bind="text: secciV1InfoText()" style="display:none;">
                <!-- ko i18n: 'EU consumer credit rules have changed and now require additional information for this payment method. This information helps you understand the key credit terms before completing your purchase. If you choose Get by email, our payment partner Ratepay will use your email address only to send this information, using a third-party email delivery provider.'--><!-- /ko -->
            </div>
        </div>
    </div>
</div>
